  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000000;
      overflow: hidden;
    }
    /* ゲーム画面の上ではドラッグやピンチでページがスクロール・拡大しないようにする。
       body 全体には付けないので、ゲーム画面の外（左右・上下の余白やフッター）ではピンチ拡大できる */
    canvas {
      touch-action: none;
    }
    /* JS の読み込み中に表示し、ゲームの最初の画面ができたら消す（src/main.ts の create） */
    .loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ccc;
      font: 20px/1.4 sans-serif;
      pointer-events: none;
    }
    /* ゲーム画面の邪魔にならないよう右下隅に小さく表示 */
    .site-footer {
      position: fixed;
      right: 8px;
      bottom: 6px;
      z-index: 10;
      font: 12px/1.4 sans-serif;
    }
    /* プレイ中は右下を押したときにリンクが反応してページを離れないよう隠す（src/main.ts の setPlaying） */
    body.is-playing .site-footer {
      visibility: hidden;
    }
    .site-footer a {
      color: #888;
      text-decoration: none;
    }
    .site-footer a:hover,
    .site-footer a:focus {
      color: #ccc;
      text-decoration: underline;
    }
    /* 見た目には表示せず、検索エンジンとスクリーンリーダー向けにゲーム説明を残す */
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
  <!-- JS が無効なら読み込みは始まらないので、読み込み中の表示を出さない -->
  <noscript><style>.loading { display: none; }</style></noscript>
</head>
<body>
  <main class="visually-hidden">
    <h1>コインキャッチゲーム</h1>
    <p>画面下のロボットを左右に動かして、上から降ってくるコインをキャッチする無料のブラウザゲームです。制限時間は20秒で、5秒ごとにレベルが上がり、コインの出現が速くなります。ハイスコアはブラウザに保存されます。</p>
    <h2>遊び方</h2>
    <ul>
      <li>PC：← / → キーで移動（マウスを押したままでも移動できます）</li>
      <li>スマホ・タブレット：画面をタッチした位置へ移動</li>
      <li>コインに触れるとスコア+1。時間が0になるとゲームオーバー</li>
    </ul>
  </main>
  <footer class="site-footer">
    <a href="https://nulltemp.com/privacy/">プライバシーポリシー</a>
  </footer>
  <div id="loading" class="loading" role="status">読み込み中…</div>
  <script>
    // src/i18n.ts の loadLanguage と同じ判定で、英語ならメッセージを差し替える（ゲーム本体の JS より先に表示するためインラインで書く）
    (function () {
      let lang = null;
      try {
        lang = localStorage.getItem('coin-catching-game-language');
      } catch (e) {
        // localStorage が使えない環境ではブラウザの言語設定に従う
      }
      if (lang !== 'ja' && lang !== 'en') {
        lang = navigator.language.toLowerCase().startsWith('ja') ? 'ja' : 'en';
      }
      if (lang === 'en') document.getElementById('loading').textContent = 'Loading…';
    })();
  </script>
  <noscript>このゲームを遊ぶには JavaScript を有効にしてください。</noscript>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
