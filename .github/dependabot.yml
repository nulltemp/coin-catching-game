# 依存パッケージの更新を月1回確認する（#34）。PR は CI（typecheck・test・build）が通ってからマージする
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      # マイナー・パッチ更新は1つの PR にまとめる
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Phaser のメジャー更新は API が変わり動作確認が必要なので、自動の PR は作らず手で上げる
      - dependency-name: phaser
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
